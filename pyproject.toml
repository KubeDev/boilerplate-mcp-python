[project]
name = "boilerplate-mcp-python"
version = "0.1.0"
description = "Boilerplate de servidor MCP em Python (FastMCP) com transporte stdio e HTTP"
readme = "README.md"
authors = [
    { name = "Fabricio Veronez", email = "fabricioveronez@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.0",
]

[project.scripts]
mcp-server = "mcp_server.__main__:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mcp_server"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
